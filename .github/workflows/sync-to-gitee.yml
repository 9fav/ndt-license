name: Sync to Gitee

on:
  push:
    branches:
      - main  # 触发分支，如果是 master 请修改为 master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/9fav      # 你的 GitHub 用户名/组织名
          dst: gitee/9fav        # 你的 Gitee 用户名/组织名
          dst_key: ${{ 34e8a3c57807515129c74903c1277aab }}
          dst_token: ${{ 34e8a3c57807515129c74903c1277aab }}
          account_type: user                    # 如果是组织账号，请改为 organization
          static_list: 'ndt'             # 仅同步这个特定的仓库名
          force_update: true
